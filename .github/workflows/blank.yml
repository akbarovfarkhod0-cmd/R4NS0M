name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Распаковка архива
    - name: Smart Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip | head -n 1)
        echo "Найдено архив: $ZIP_FILE"
        unzip -o "$ZIP_FILE" -d temp_unzip
        
        if [ -f temp_unzip/gradlew ]; then
          mv temp_unzip/* .
        else
          INNER_DIR=$(ls temp_unzip | head -n 1)
          echo "Обнаружена вложенная папка: $INNER_DIR"
          mv temp_unzip/$INNER_DIR/* . 2>/dev/null || mv temp_unzip/$INNER_DIR/.* . 2>/dev/null || true
          mv temp_unzip/$INNER_DIR/* . || true
        fi
        rm -rf temp_unzip

    # 2. ЖЕСТКАЯ ПЕРЕЗАПИСЬ СИСТЕМНЫХ КОНФИГУРАЦИЙ (Чистим косяки импорта)
    - name: Force Clean Rebuild Environment
      run: |
        echo "=== Создаем чистые файлы сборки ==="
        mkdir -p gradle/wrapper
        
        # Перезаписываем свойства gradle
        cat <<EOF > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-all.zip
        EOF

        # Перезаписываем корневой build.gradle
        cat <<EOF > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Перезаписываем корневой settings.gradle
        cat <<EOF > settings.gradle
        include ':app'
        EOF

        # Перезаписываем внутренний app/build.gradle под стабильную версию
        cat <<EOF > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            compileSdk 34
            defaultConfig {
                applicationId "com.fl0pp3r.r4ns0m"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            namespace "com.fl0pp3r.r4ns0m"
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        EOF

    # 3. Санитария названий ресурсов
    - name: Sanitize Resource Filenames
      run: |
        echo "=== Авто-исправление имен файлов ==="
        find app/src/main/res -type f | while read -r file; do
          dir=$(dirname "$file")
          base=$(basename "$file")
          ext="${base##*.}"
          name="${base%.*}"
          clean_name=$(echo "$name" | tr '-' '_' | tr '.' '_' | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_')
          new_file="$dir/${clean_name}.${ext}"
          if [ "$file" != "$new_file" ]; then
            mv "$file" "$new_file"
          fi
        done

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Сборка приложения
    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon

    # 5. Выгрузка готового APK r4ns0m-apk
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: r4ns0m-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
          
