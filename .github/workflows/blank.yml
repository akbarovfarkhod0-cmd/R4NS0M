                    panicView?.setImageResource(if (strobeToggle) R.drawable.ransom_face_a else R.drawable.ransom_face_b)
                    strobeToggle = !strobeToggle
                    strobeCount++
                    handler.postDelayed(this, STROBE_FRAME_INTERVAL)
                }
            }

