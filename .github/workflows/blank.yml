name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Умная распаковка архива
    - name: Smart Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip | head -n 1)
        echo "Найдено архив: $ZIP_FILE"
        unzip -o "$ZIP_FILE" -d temp_unzip
        
        if [ -f temp_unzip/gradlew ]; then
          mv temp_unzip/* .
        else
          INNER_DIR=$(ls temp_unzip | head -n 1)
          echo "Обнаружена вложенная папка: $INNER_DIR"
          mv temp_unzip/$INNER_DIR/* . 2>/dev/null || mv temp_unzip/$INNER_DIR/.* . 2>/dev/null || true
          mv temp_unzip/$INNER_DIR/* . || true
        fi
        rm -rf temp_unzip

    # 2. ПРИНУДИТЕЛЬНОЕ ИСПРАВЛЕНИЕ ВЕРСИЙ GRADLE (Убирает конфликты IDE)
    - name: Force Fix Gradle Configurations
      run: |
        echo "=== Принудительно выставляем рабочие версии Gradle ==="
        mkdir -p gradle/wrapper
        cat <<EOF > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip
        EOF
        
        # Обновляем build.gradle, чтобы он не требовал ломаную версию 8.13
        find . -name "build.gradle" -type f | while read -r f; do
          sed -i 's/com.android.tools.build:gradle:8.13/com.android.tools.build:gradle:8.2.2/g' "$f" || true
          sed -i 's/com.android.application:8.13/com.android.application:8.2.2/g' "$f" || true
        done

    # 3. Санитария названий файлов ресурсов
    - name: Sanitize Resource Filenames
      run: |
        echo "=== Авто-исправление имен файлов ==="
        find app/src/main/res -type f | while read -r file; do
          dir=$(dirname "$file")
          base=$(basename "$file")
          ext="${base##*.}"
          name="${base%.*}"
          clean_name=$(echo "$name" | tr '-' '_' | tr '.' '_' | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_')
          new_file="$dir/${clean_name}.${ext}"
          if [ "$file" != "$new_file" ]; then
            mv "$file" "$new_file"
          fi
        done

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Сборка приложения на стабильной конфигурации
    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon

    # 5. Выгрузка готового APK r4ns0m-apk
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: r4ns0m-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
          
