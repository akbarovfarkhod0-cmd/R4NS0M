name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Распаковка архива и исправление структуры
    - name: Smart Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip | head -n 1)
        echo "Найдено архив: $ZIP_FILE"
        unzip -o "$ZIP_FILE" -d temp_unzip
        
        if [ -f temp_unzip/gradlew ]; then
          mv temp_unzip/* .
        else
          INNER_DIR=$(ls temp_unzip | head -n 1)
          echo "Обнаружена вложенная папка: $INNER_DIR"
          mv temp_unzip/$INNER_DIR/* . 2>/dev/null || mv temp_unzip/$INNER_DIR/.* . 2>/dev/null || true
          mv temp_unzip/$INNER_DIR/* . || true
        fi
        rm -rf temp_unzip

    # 2. ИСПРАВЛЕНИЕ НАЗВАНИЙ ФАЙЛОВ (Наша Галина без опечаток)
    - name: Sanitize Resource Filenames
      run: |
        echo "=== Проверяем и исправляем имена файлов в ресурсах ==="
        find app/src/main/res -type f | while read -r file; do
          dir=$(dirname "$file")
          base=$(basename "$file")
          ext="${base##*.}"
          name="${base%.*}"
          
          # Заменяем дефисы и точки в имени на нижнее подчеркивание, переводим в нижний регистр (lower)
          clean_name=$(echo "$name" | tr '-' '_' | tr '.' '_' | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_')
          new_file="$dir/${clean_name}.${ext}"
          
          if [ "$file" != "$new_file" ]; then
            echo "Переименовываем: $base -> ${clean_name}.${ext}"
            mv "$file" "$new_file"
          fi
        done

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 3. Сборка приложения
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 4. Выгрузка готового APK (С твоим кастомным именем r4ns0m-apk)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: r4ns0m-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
          
