name: Android CI

on:
  workflow_dispatch: # Жестко возвращает кнопку ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Smart Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip | head -n 1)
        unzip -o "$ZIP_FILE" -d temp_unzip
        if [ -f temp_unzip/gradlew ]; then
          mv temp_unzip/* .
        else
          INNER_DIR=$(ls temp_unzip | head -n 1)
          mv temp_unzip/$INNER_DIR/* . 2>/dev/null || mv temp_unzip/$INNER_DIR/.* . 2>/dev/null || true
          mv temp_unzip/$INNER_DIR/* . || true
        fi
        rm -rf temp_unzip

    - name: set up JDK 17
      uses: actions/setup-java@v4 # Возвращаем v4, чтобы убрать конфликты версий сред
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: r4ns0m-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
          
