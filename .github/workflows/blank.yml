name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Автоматический поиск папки внутри ZIP и распаковка
    - name: Smart Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip | head -n 1)
        echo "Найдено архив: $ZIP_FILE"
        unzip -o "$ZIP_FILE" -d temp_unzip
        
        # Проверяем, есть ли внутри вложенная папка, и вытаскиваем всё в корень
        if [ -f temp_unzip/gradlew ]; then
          mv temp_unzip/* .
        else
          INNER_DIR=$(ls temp_unzip | head -n 1)
          echo "Обнаружена вложенная папка: $INNER_DIR"
          mv temp_unzip/$INNER_DIR/* . 2>/dev/null || mv temp_unzip/$INNER_DIR/.* . 2>/dev/null || true
          mv temp_unzip/$INNER_DIR/* . || true
        fi
        rm -rf temp_unzip
        
        echo "=== Файлы в корне после умной распаковки ==="
        ls -la

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 2. Выдача прав на запуск компилятора
    - name: Grant execute permission for gradlew
      run: |
        chmod +x gradlew
        corepack enable || true

    # 3. Сама сборка отладочного APK
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 4. Выгрузка готового файла для скачивания
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: r4ns0m-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
          
