name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Распаковка архива ради картинок и звуков из папки res/
    - name: Smart Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip | head -n 1)
        echo "Найдено архив: $ZIP_FILE"
        unzip -o "$ZIP_FILE" -d temp_unzip
        
        if [ -f temp_unzip/gradlew ]; then
          mv temp_unzip/* .
        else
          INNER_DIR=$(ls temp_unzip | head -n 1)
          echo "Обнаружена вложенная папка: $INNER_DIR"
          mv temp_unzip/$INNER_DIR/* . 2>/dev/null || mv temp_unzip/$INNER_DIR/.* . 2>/dev/null || true
          mv temp_unzip/$INNER_DIR/* . || true
        fi
        rm -rf temp_unzip

    # 2. ЖЕСТКАЯ ПЕРЕЗАПИСЬ КОДА И СТРУКТУРЫ (Исправляет косяки синтаксиса)
    - name: Force Clean and Write Working Code
      run: |
        echo "=== Создаем чистую кодовую базу ==="
        mkdir -p app/src/main/java/com/fl0pp3r/r4ns0m
        mkdir -p gradle/wrapper

        # ── ПЕРЕЗАПИСЬ COINARCHIVEMANAGER ──
        cat << 'EOF' > app/src/main/java/com/fl0pp3r/r4ns0m/CoinArchiveManager.kt
        package com.fl0pp3r.r4ns0m
        import android.content.Context
        class CoinArchiveManager(private val context: Context) {
            companion object {
                const val COIN_COUNT = 0
            }
            suspend fun cleanupCoins() {
                val prefs = context.getSharedPreferences("game_settings", Context.MODE_PRIVATE)
                prefs.edit().putInt("saved_coins", 0).apply()
            }
        }
        EOF

        # ── ПЕРЕЗАПИСЬ MAINACTIVITY ──
        cat << 'EOF' > app/src/main/java/com/fl0pp3r/r4ns0m/MainActivity.kt
        package com.fl0pp3r.r4ns0m
        import android.content.Context
        import android.content.Intent
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.RadioGroup
        import android.widget.Switch
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val prefs = getSharedPreferences("game_settings", Context.MODE_PRIVATE)
                val isFirstLaunch = prefs.getBoolean("is_first_launch", true)
                val isA90Enabled = prefs.getBoolean("a90_enabled", true)

                if (!checkOverlayPermission()) {
                    requestOverlayPermission()
                    return
                }
                if (!isA90Enabled) {
                    initSettingsScreen(prefs)
                    return
                }
                if (isFirstLaunch) {
                    prefs.edit().putBoolean("is_first_launch", false).apply()
                    startBackgroundGameService()
                    finish() 
                } else {
                    initSettingsScreen(prefs)
                }
            }

            private fun checkOverlayPermission(): Boolean {
                return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                    Settings.canDrawOverlays(this)
                } else {
                    true 
                }
            }

            private fun requestOverlayPermission() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                    Toast.makeText(this, "Разрешите отображение поверх окон!", Toast.LENGTH_LONG).show()
                    val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                    startActivity(intent)
                    finish() 
                }
            }

            private fun initSettingsScreen(prefs: android.content.SharedPreferences) {
                setContentView(R.layout.activity_main)
                val switchA90 = findViewById<Switch>(R.id.switch_a90)
                val radioGroupMode = findViewById<RadioGroup>(R.id.radio_group_mode)
                val btnSave = findViewById<Button>(R.id.btn_save)

                switchA90.isChecked = prefs.getBoolean("a90_enabled", true)
                val isScreenMode = prefs.getBoolean("collect_on_screen", false)
                radioGroupMode.check(if (isScreenMode) R.id.radio_screen else R.id.radio_gallery)

                btnSave.setOnClickListener {
                    val selectedModeId = radioGroupMode.checkedRadioButtonId
                    val collectOnScreen = (selectedModeId == R.id.radio_screen)
                    prefs.edit().apply {
                        putBoolean("a90_enabled", switchA90.isChecked)
                        putBoolean("collect_on_screen", collectOnScreen)
                        apply()
                    }
                    val serviceIntent = Intent(this, GameBackgroundService::class.java).apply {
                        putExtra("update_settings", true)
                    }
                    startService(serviceIntent)
                    Toast.makeText(this, "Применено!", Toast.LENGTH_SHORT).show()
                    finish()
                }
            }

            private fun startBackgroundGameService() {
                val intent = Intent(this, GameBackgroundService::class.java)
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)
            }
        }
        EOF

        # ── ПЕРЕЗАПИСЬ GAMEBACKGROUNDSERVICE ──
        cat << 'EOF' > app/src/main/java/com/fl0pp3r/r4ns0m/GameBackgroundService.kt
