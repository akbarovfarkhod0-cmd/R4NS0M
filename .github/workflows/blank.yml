name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # === ШАГ РАСПАКОВКИ АРХИВА ===
    # Замени ИМЯ_ТВОЕГО_ФАЙЛА.zip на реальное название твоего архива (например, R4NS0M.zip)
    - name: Unzip project archive
      run: |
        unzip -o r4ns0m.zip -d .
        echo "=== Содержимое папки после распаковки ==="
        ls -la

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: r4ns0m-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
